name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + CPU property tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # opencv-python needs libGL, which a bare Ubuntu runner does not have
      - name: Install libGL for opencv-python
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # .[dev] has no torch, ultralytics or CUDA, on purpose
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -v

      # make sure the filter layer never imports the model stack
      - name: Assert the CPU layer stays free of the model stack
        run: |
          python - <<'PY'
          import sys
          import app.config, app.motion_filter, app.overlay_mask  # noqa: F401
          heavy = sorted({m for m in ("torch", "torchvision", "ultralytics") if m in sys.modules})
          if heavy:
              sys.exit(f"the pure-CV layer pulled in {heavy}; keep it importable without the model stack")
          print("CPU layer clean: no torch, torchvision or ultralytics")
          PY
