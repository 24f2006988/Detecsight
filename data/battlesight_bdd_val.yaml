# Ground-level vehicle val split with real human labels: 1,497 BDD100K frames.
# Held out of the training blend on purpose.
#
# This is where a vehicle fix shows up or does not. Deployed best.pt scores
# light_vehicle 0.2821 here against 0.860 on the aerial promotion val, and
# heavy_vehicle 0.0254 against 0.449. See log 20 and ENGINEERING_LOG.md.
#
# It is a PROXY: dashcam is not shibuya's fixed elevated camera. Read it
# alongside battlesight_ground.yaml, which is the real domain with draft labels.
#
# Not added to the promotion val -- that must stay byte-identical to
# battlesight_multi.yaml's or the log's mAP history stops being comparable.
#
# The `train:` key below is a required-key placeholder, NOT training data.
path: VisDrone

train:
  - ../BDD100K/images/val   # NOT training data -- see above; required key only

val:
  - ../BDD100K/images/val

names:
  0: personnel
  1: two_wheeler
  2: light_vehicle
  3: heavy_vehicle
