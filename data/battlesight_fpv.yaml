# The training blend: VisDrone + VisDrone test-dev + WiderPerson + AerialPerson
# + SARD + BDD100K. 31,238 images.
#
# GENERATED by scripts/prepare_training.py -- do not hand-edit, it will be
# overwritten. That script omits any source not on disk, because ultralytics
# fails hard on a missing path.
#
# AerialPerson carries vehicle PSEUDO-LABELS (scripts/pseudo_label_vehicles.py).
# Without them its ~258,000 unlabelled cars would train the model to treat
# aerial vehicles as background. BDD100K needs no such thing, measured.
#
# The val list must stay byte-identical to battlesight_multi.yaml's, or every
# mAP figure in ENGINEERING_LOG.md stops being comparable.
#
# Paths anchor at VisDrone and reach siblings with `../`, so this names no drive.
# Set the root once with `yolo settings datasets_dir="<path>"`.
path: VisDrone

train:
  - images/train
  - images/test
  - ../WiderPerson/images/train
  - ../AerialPerson/images/train
  - ../SARD/images/train
  - ../BDD100K/images/train

val:
  - images/val
  - ../WiderPerson/images/val

names:
  0: personnel
  1: two_wheeler
  2: light_vehicle
  3: heavy_vehicle
