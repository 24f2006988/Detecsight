[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detecsight"
version = "1.0.0"
description = "Real-time person and vehicle detection for drone and helmet-camera video"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Hrisit Roy" }]
keywords = ["object-detection", "yolo", "uav", "tensorrt", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "License :: OSI Approved :: MIT License",
]

# numpy and OpenCV are all the motion and overlay filters need. Keeping them free
# of torch is what lets those tests run on a CPU-only CI box in seconds, and CI
# installs only `.[dev]`, so a stray `import torch` there fails the build.
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The full service: model stack plus the HTTP and WebSocket layer.
# torch is not pinned. requirements.txt pins a +cu126 build that only exists on
# PyTorch's own index and cannot be installed without CUDA. The Dockerfile
# installs the CPU wheels first so it does not pull 2.5 GB of CUDA libraries.
serve = [
    "torch>=2.6",
    "torchvision>=0.21",
    "ultralytics>=8.4",
    "lap>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "aiortc>=1.9",
]

# TensorRT FP16 export (scripts/export_engine.py). Not pinned, because the right
# wheel depends on your CUDA and driver. Without an engine it falls back to the
# .pt checkpoint, about 2x slower.
gpu = [
    "tensorrt-cu12",
    "tensorrt-cu12-libs",
    "tensorrt-cu12-bindings",
]

# Augmentation for training. Kept separate because albumentations pulls in
# opencv-python-headless, which overwrites opencv-python and breaks preview
# windows. Install it in a training environment only.
train = [
    "albumentations>=2.0",
    "matplotlib>=3.9",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/24f2006988/Detecsight"

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run needs no GPU, checkpoint or server. Opt in to the rest:
#   pytest -m gpu       needs a CUDA device
#   pytest -m model     needs a checkpoint on disk
#   pytest -m server    needs uvicorn on 127.0.0.1:8000
#   pytest -m ""        everything
addopts = "-m 'not gpu and not model and not server'"
markers = [
    "gpu: requires a CUDA device",
    "model: requires a detection checkpoint on disk",
    "server: requires a running uvicorn instance on 127.0.0.1:8000",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Not `UP` (pyupgrade). It fires about 95 times on typing.Dict and .format() in
# code that works, and would mean a big diff with no change in behaviour.
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # long lines are almost all measurement tables in comments
    "B008",  # FastAPI's Depends()/File() defaults are the documented idiom
]
