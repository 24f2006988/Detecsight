# Ground-level vehicle validation split -- the measurement section 20 said was
# a prerequisite for fixing anything about vehicles.
#
# WHY THIS EXISTS. The promotion val (battlesight_multi.yaml) is VisDrone val
# plus WiderPerson val: aerial-dominated, and structurally unable to see the
# failure section 20 measured. On dense ground-level footage the deployed model
# reports 0.10 vehicles per frame at the deployed conf 0.25 on frames plainly
# containing six, while a stock COCO control finds 5.80 and our own model finds
# 4.60 at conf 0.02. It localises them and kills them at the threshold. None of
# that is visible in the blended val, which is why no vehicle fix could be
# measured before this file.
#
# SOURCE. 161 frames sampled every 20th from G:/fusionsight/shibuya.mp4, the
# 3,212-frame rush-hour pedestrian crossing used throughout section 20.
# 1280x720, hundreds of people per frame at every scale, vehicles crossing
# between phases.
#
# *** THE LABELS ARE DRAFT, NOT GROUND TRUTH. ***
#
# They were generated by stock COCO yolo26n (see scripts, draft_labels) and
# remapped 4-class. Stock COCO was used deliberately rather than this project
# own checkpoint, because scoring a model against its own predictions measures
# self-agreement rather than accuracy -- the same reasoning that put a stock
# COCO control in section 20, and the same reasoning that keeps AerialPerson
# val out of the training yaml.
#
# A number computed against these labels measures AGREEMENT WITH COCO. That is
# a useful lower bound for a class the model currently misses almost entirely,
# and it is not a promotion metric. Correct these boxes by hand before quoting
# any figure from this split as accuracy. Draft boxes are far faster to fix
# than to draw, which is the only reason they are here.
#
# DO NOT TRAIN ON THIS FILE. The `train:` key below points at the val images
# and exists only because ultralytics REQUIRES the key -- check_det_dataset()
# raises "'train:' key missing" on a val-only yaml and refuses to load it, in
# val mode too. Without this line the file cannot be opened at all, which is
# how it shipped on 2026-09-06 and why no number was ever read off it.
# The key is not read when running `yolo val`.
#
# Adding ground-level vehicle TRAINING data is a separate and larger job, and
# it must not be drawn from the clip it is evaluated on. That job was done on
# 2026-09-07 with BDD100K -- see scripts/convert_bdd100k.py and
# data/battlesight_bdd_val.yaml, which is the same measurement with real human
# labels instead of the draft ones here.

path: GroundVehicle

train:
  - images/val   # NOT training data -- see above; required key only

val:
  - images/val

names:
  0: personnel
  1: two_wheeler
  2: light_vehicle
  3: heavy_vehicle
