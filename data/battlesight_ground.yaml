# Ground-level vehicle val split: 161 frames from the shibuya crossing clip,
# the target domain for the failure in log 20.
#
# *** THE LABELS ARE DRAFT. *** Generated by stock COCO yolo26n and remapped
# 4-class, so a number computed here measures AGREEMENT WITH COCO, not accuracy.
# Useful as a lower bound for a class the model misses almost entirely. Not a
# promotion metric. Correct them by hand before quoting any figure as accuracy.
#
# The `train:` key below is a required-key placeholder, NOT training data:
# ultralytics check_det_dataset() rejects a val-only yaml even in val mode.
path: GroundVehicle

train:
  - images/val   # NOT training data -- see above; required key only

val:
  - images/val

names:
  0: personnel
  1: two_wheeler
  2: light_vehicle
  3: heavy_vehicle
