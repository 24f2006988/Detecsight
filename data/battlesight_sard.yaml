# SARD alone: 4,041 UAV frames of people in terrain, including prone and
# crouching, which is the pose case nothing else in the mix has.
#
# Training on this ALONE was measured and REJECTED (log 21): target recall
# 0.143 -> 0.870, but blended personnel mAP50 0.706 -> 0.221 with two classes
# collapsed. Catastrophic forgetting. The data was right, training on it alone
# was not -- it is blended in battlesight_fpv.yaml instead.
#
# Kept for measuring SARD in isolation, not for training.
path: SARD

train:
  - images/train

val:
  - images/val

names:
  0: personnel
  1: two_wheeler
  2: light_vehicle
  3: heavy_vehicle
