# Ground-level vehicle validation split -- the measurement section 20 named as
# a prerequisite for fixing anything about vehicles, with real labels.
#
# WHY THIS EXISTS. The promotion val (battlesight_multi.yaml, and the val list
# in battlesight_fpv.yaml which is identical to it) is VisDrone val plus
# WiderPerson val: aerial-dominated, and structurally unable to see the failure
# section 20 measured. It scores light_vehicle at mAP50 0.860 while the model
# returns 0.27 vehicles per frame on dense ground-level footage containing six.
# Re-measured 2026-09-07 on the current post-SARD checkpoint, shibuya frames
# 500-559:
#
#   deployed best.pt @ conf 0.25    0.27 vehicles/frame
#   deployed best.pt @ conf 0.02    6.35 vehicles/frame
#   stock COCO yolo26n @ conf 0.35  5.60 vehicles/frame
#
# The model localises them and kills them at the threshold. None of that is
# visible in the promotion val, which is why this file exists.
#
# HOW IT RELATES TO data/battlesight_ground.yaml. That split is 161 frames of
# shibuya.mp4 with DRAFT labels generated by stock COCO, so a number computed
# against it measures agreement with COCO rather than accuracy. It stays --
# shibuya is the actual target domain and a fixed elevated street camera is not
# a dashcam. But it cannot carry a promotion number and this one can:
#
#   battlesight_ground.yaml   161 frames   draft COCO labels    target domain
#   battlesight_bdd_val.yaml  1500 frames  real human labels    proxy domain
#
# Read them together. A fix that moves this one and not that one has improved
# dashcam vehicles without improving the case the product actually failed on.
#
# SOURCE. 1,500 images held out of the BDD100K subset by
# scripts/convert_bdd100k.py (seed 0), stratified over timeofday x scene so the
# split is not accidentally all daytime city street -- which is what a plain
# random draw drifts towards, and would hide exactly the night and highway
# cases this dataset was added for. 1280x720, the deployment resolution.
# BDD100K takes one frame per source video, so no image here shares a clip with
# anything in the train split.
#
# NOT IN THE PROMOTION VAL, ON PURPOSE. The promotion val must stay
# byte-identical to battlesight_multi.yaml's or every mAP figure recorded in
# the log stops being comparable. This is read separately and explicitly, the
# same arrangement SARD test has -- the measurement that says whether the fix
# worked is not the same measurement that guards against regression, and log
# section 22 is the reminder of what happens when one is asked to do both.
#
# DO NOT TRAIN ON THIS FILE. The `train:` key below points at the val images,
# and it is there only because ultralytics REQUIRES the key: check_det_dataset()
# raises "'train:' key missing" on a val-only yaml and refuses to load it, in
# val mode too. It is never read when running `yolo val`. Training on this would
# train on the held-out split, and the BDD training images are somewhere else
# entirely -- they are reached through battlesight_fpv.yaml, generated by
# scripts/prepare_training.py.
#
#   yolo val model=weights/best.pt data=data/battlesight_bdd_val.yaml \
#     imgsz=1280 device=0 max_det=317

path: VisDrone

train:
  - ../BDD100K/images/val   # NOT training data -- see above; required key only

val:
  - ../BDD100K/images/val

names:
  0: personnel
  1: two_wheeler
  2: light_vehicle
  3: heavy_vehicle
